## Unit definitions for converting between different unit systems.
[CGS_UNIT]
km = 1e5
pc = 3.08e18
kpc = 3.08e21
Mpc = 3.08e24
Gpc = 3.08e27
yr = 3.1536e7
Myr = 3.1536e13
Gyr = 3.1536e16

K = 1.0
Msun = 2e33

## Physical constants in CGS units.
[CGS_CONSTANTS]
m_u = 1.66e-24
k_B = 1.38e-16

## Particle type definitions that can be converted to particle family in RAMSES output. Multiple families can be assigned to the same type.
[PARTICLE_TYPE_DEFINITION]
cloud_tracer = -3
star_tracer = -2
gas_tracer = 0
dm = 1
star = 2
cloud = 3
