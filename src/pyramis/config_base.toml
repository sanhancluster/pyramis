# This file contains the default configuration settings for Pyramis. You can override these settings by creating a `config.toml` file in the same directory as your script or notebook, and specifying the desired settings there.
# Except for directory paths, changing the file name formats are not recommended.

## Verbosity level for logging. Higher values will produce more detailed logs.
VERBOSE_LEVEL = 1

## Directory paths for input and output data. You can change these to match your directory structure.
OUTPUT_FORMAT = "output_{iout:05d}"
OUTPUT_FORMAT_ANY = "output_*"

FILENAME_FORMAT_RAMSES = "{data}_{iout:05d}.out{icpu:05d}"
FILENAME_FORMAT_RAMSES_ANY = "{data}_{iout:05d}.out*"

NAMELIST_FILENAME = "namelist.txt"
FILE_DESCRIPTOR_FORMAT = "{data}_file_descriptor.txt"

FILENAME_FORMAT_HDF = "hdf/{data}_{iout:05d}.h5"
FILENAME_FORMAT_HDF_ANY = "hdf/{data}_*.h5"

FILENAME_FORMAT_HALOMAKER = "halo/tree_bricks{iout:05d}"
FILENAME_FORMAT_GALAXYMAKER = "galaxy/tree_bricks{iout:05d}"
FILENAME_FORMAT_PTREE = "ptree/ptree_{iout:05d}.pkl"

## Default variable name set to use when reading data. "native" and "simple" are possible.
VNAME_SET = "native"

FILENAME_FORMAT_SINKPROPS_ANY = "SINKPROPS/sink_*.dat"
FILENAME_FORMAT_SINKPROPS = "SINKPROPS/sink_{icoarse:05d}.dat"

FILENAME_FORMAT_DYABLO = "{prefix}_iter{istep:07d}.h5"

## Default settings for reading RAMSES output.
### Number of processes to use for parallel processing. "auto" will use all available CPU cores.
DEFAULT_N_PROCS = "auto"
### Number of subdivisions for the domain computation for RAMSES output, higher values will increase accuracy but also increase computation time.
DEFAULT_LEVEL_SUBDIVIDE = 2

## Data type definitions for reading sink particle properties. This should match the structure of the sink property files generated by RAMSES.
SINKPROPS_DTYPE = [
    ["identity", "i4"], ["mass", "f8"],
    ["position_x", "f8"], ["position_y", "f8"], ["position_z", "f8"],
    ["velocity_x", "f8"], ["velocity_y", "f8"], ["velocity_z", "f8"],
    ["jsink_x", "f8"], ["jsink_y", "f8"], ["jsink_z", "f8"],
    ["birth_time", "f8"], ["dMBHoverdt", "f8"], ["dMEdoverdt", "f8"], ["dMsmbh", "f8"],
    ["d_avgptr", "f8"], ["c_avgptr", "f8"], ["v_avgptr", "f8"],
    ["Esave", "f8"], ["spin_x", "f8"], ["spin_y", "f8"], ["spin_z", "f8"],
    ["spin_magnitude", "f8"], ["eps_sink", "f8"],
    ["rho_star", "f8"], ["rho_dm", "f8"],
    ["star_vx", "f8"], ["star_vy", "f8"], ["star_vz", "f8"],
    ["dm_vx", "f8"], ["dm_vy", "f8"], ["dm_vz", "f8"],
    ["n_star", "i4"], ["n_dm", "i4"],
    ["rho_star_slow", "f8"], ["rho_dm_slow", "f8"],
    ["f_star_fast", "f8"], ["f_dm_fast", "f8"],
    ["DF_gas", "f8"], ["DF_star", "f8"], ["DF_dm", "f8"],
]

