[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyramis"
version = "0.1.22"
description = "Python Reader for Adaptive Mesh Interface Simulations"
authors = [
  {name="San Han", email="san.han@iap.fr"}
]
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "h5py>=3.11.0",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "scikit-image>=0.21.0",
    "platformdirs>=2.0.0",
    "tqdm>=4.65.0",
    "seaborn>=0.13.2"
]
readme = "README.md"
keywords = ["ramses"]

[project.scripts]
amr2hdf = "pyramis.scripts.amr2hdf:main"
sinkprops2hdf = "pyramis.scripts.sinkprops2hdf:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.package-data]
pyramis = ["*.toml"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/sanhancluster/pyramis"
